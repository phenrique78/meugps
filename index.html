<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<!-- Importante para funcionar bem no celular -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Meu GPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #0a0a0b;
    --panel: #141416;
    --panel-2: #1b1b1e;
    --line: #2b2b2f;
    --line-soft: #232326;
    --gray: #8b8b90;
    --gray-dim: #55555a;
    --white: #e9e9ea;
    --yellow: #f4c02f;
    --yellow-dim: #6b5a1f;
    --yellow-glow: rgba(244, 192, 47, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--black);
  }

  body {
    font-family: 'Rajdhani', Arial, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 18px 40px;
    color: var(--white);
    background:
      radial-gradient(circle at 50% 0%, #1a1a1c 0%, var(--black) 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    min-height: 100vh;
  }

  /* ---------- Header ---------- */

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }

  .brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
  }

  .brand-name .kicker {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--gray-dim);
    font-weight: 600;
  }

  .brand-name h1 {
    margin: 2px 0 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .brand-name h1 span {
    color: var(--yellow);
  }

  .pin {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  /* ---------- Status strip ---------- */

  .status-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }

  .led {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--gray-dim);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transition: background 0.2s, box-shadow 0.2s;
  }

  .led.on {
    background: var(--yellow);
    box-shadow: 0 0 8px 2px var(--yellow-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .led.erro {
    background: #b3492a;
    box-shadow: 0 0 8px 2px rgba(179, 73, 42, 0.4);
    animation: none;
  }

  .led.pausado {
    background: var(--yellow-dim);
    box-shadow: 0 0 4px 1px rgba(244, 192, 47, 0.25);
    animation: none;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px 1px var(--yellow-glow); }
    50% { box-shadow: 0 0 12px 4px var(--yellow-glow); }
  }

  .status-strip .label {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gray-dim);
    font-weight: 600;
  }

  .status-strip .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--white);
    margin-left: auto;
    text-align: right;
  }

  /* ---------- Dashboard (velocímetro central + lista à direita) ---------- */

  .dashboard {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .col-esquerda {
    flex: 0 0 126px;
    justify-content: center;
  }

  .col-direita {
    flex: 0 0 128px;
    gap: 0;
  }

  /* painéis da coluna esquerda: cronômetro 0-100 e velocidade máxima */
  .painel-esq {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .painel-esq .rotulo {
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--gray);
    font-weight: 600;
  }

  .painel-esq .unidade {
    font-size: 9px;
    letter-spacing: 0.16em;
    color: var(--yellow);
    font-weight: 600;
  }

  /* switch pequeno usado no cronômetro 0-100 */
  .switch-mini {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 22px;
  }

  .switch-mini input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .switch-mini .track {
    position: absolute;
    inset: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .switch-mini .track::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 3px;
    top: 3px;
    background: var(--gray);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .switch-mini input:checked + .track {
    background: #2a2410;
    border-color: var(--yellow-dim);
  }

  .switch-mini input:checked + .track::before {
    transform: translateX(16px);
    background: var(--yellow);
    box-shadow: 0 0 6px 1px var(--yellow-glow);
  }

  .cronometro {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }

  .cronometro.ativo,
  .cronometro.concluido {
    color: var(--yellow);
  }

  .valor-max {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }

  #tempoFuncionamento {
    font-size: 15px;
    letter-spacing: 0.01em;
  }

  /* ---------- Speed gauge (hero central) ---------- */

  .col-centro {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gauge-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .gauge {
    --pct: 0;
    position: relative;
    width: 100%;
    max-width: min(78vw, 340px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: conic-gradient(var(--yellow) calc(var(--pct) * 1%), var(--line-soft) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px var(--line), 0 12px 30px -12px rgba(0,0,0,0.8);
  }

  .gauge::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, var(--panel-2) 0%, var(--black) 100%);
    border: 1px solid var(--line);
  }

  .gauge-inner {
    position: relative;
    text-align: center;
    z-index: 1;
  }

  .gauge-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(40px, 11vw, 68px);
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .gauge-unit {
    margin-top: 6px;
    font-size: 13px;
    letter-spacing: 0.24em;
    color: var(--yellow);
    font-weight: 600;
  }

  /* ---------- Lista de dados (coluna direita, compacta) ---------- */

  .dado {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: none;
    padding: 8px 10px;
    position: relative;
    overflow: hidden;
  }

  .col-direita .dado:first-child {
    border-top: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
  }

  .col-direita .dado:last-child {
    border-radius: 0 0 8px 8px;
  }

  .dado::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--yellow-dim);
  }

  .dado .rotulo {
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--gray);
    font-weight: 600;
    margin-bottom: 2px;
  }

  .dado .valor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--white);
    word-break: break-all;
    line-height: 1.25;
  }

  /* dados ocultos por enquanto (horário / pontos coletados) */
  .oculto {
    display: none;
  }

  /* ---------- Buttons ---------- */

  .botoes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    flex: 1 1 auto;
    min-width: 108px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--white);
    font-family: 'Rajdhani', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }

  button:active {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  #btnIniciar:not(:disabled) {
    border-color: var(--yellow-dim);
    color: var(--yellow);
  }

  #btnIniciar:not(:disabled):hover {
    background: #201a0c;
    border-color: var(--yellow);
  }

  #btnPausar:not(:disabled) {
    border-color: #4a4a4f;
  }

  #btnPausar:not(:disabled):hover {
    background: var(--panel-2);
    border-color: var(--gray);
  }

  #btnRetomar:not(:disabled) {
    border-color: var(--yellow-dim);
    color: var(--yellow);
  }

  #btnRetomar:not(:disabled):hover {
    background: #201a0c;
    border-color: var(--yellow);
  }

  #btnEncerrar:not(:disabled) {
    border-color: #4a4a4f;
  }

  #btnEncerrar:not(:disabled):hover {
    background: var(--panel-2);
    border-color: var(--gray);
  }

  #btnSalvar:not(:disabled) {
    border-color: var(--yellow-dim);
  }

  #btnSalvar:not(:disabled):hover {
    background: #201a0c;
    border-color: var(--yellow);
  }

  /* ---------- Rastro do trajeto (fundo da tela) ---------- */

  #trilhaSvg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
  }

  .conteudo {
    position: relative;
    z-index: 1;
  }

  .trilha-linha {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
  }

  .trilha-ponto {
    fill: var(--yellow);
  }

  .rodape {
    text-align: center;
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--gray-dim);
  }

  /* ---------- Responsivo: empilha em telas estreitas ---------- */

  @media (max-width: 560px) {
    .dashboard {
      flex-direction: column;
    }

    .col-centro { order: 1; width: 100%; }
    .col-direita {
      order: 2;
      flex-direction: row;
      flex-wrap: wrap;
      flex-basis: auto;
      width: 100%;
      gap: 8px;
    }
    .col-direita .dado {
      flex: 1 1 calc(50% - 4px);
      border-radius: 8px !important;
      border-top: 1px solid var(--line) !important;
    }
    .col-esquerda {
      order: 3;
      flex-basis: auto;
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
    }
    .col-esquerda .painel-esq {
      flex: 1 1 calc(50% - 4px);
    }

    .gauge {
      max-width: min(70vw, 260px);
    }
  }
</style>

</head>


<body>

  <svg id="trilhaSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="trilhaGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
    <polyline id="trilhaLinha" class="trilha-linha" points="" filter="url(#trilhaGlow)"></polyline>
    <circle id="trilhaPonto" class="trilha-ponto" r="7" cx="-100" cy="-100" filter="url(#trilhaGlow)"></circle>
  </svg>

  <div class="conteudo">

  <div class="brand">
    <div class="brand-name">
      <span class="kicker">RASTREAMENTO GPS</span>
      <h1>Meu <span>GPS</span></h1>
    </div>
    <div class="pin">📍</div>
  </div>

  <div class="status-strip">
    <div class="led" id="led"></div>
    <span class="label">STATUS</span>
    <span class="value" id="status">Parado</span>
  </div>

  <div class="dashboard">

    <!-- Coluna esquerda: cronômetro 0-100 km/h e velocidade máxima -->
    <div class="col col-esquerda">

      <div class="painel-esq">
        <span class="rotulo">0-100 KM/H</span>
        <label class="switch-mini">
          <input type="checkbox" id="toggle0100" onchange="alternar0100(this)">
          <span class="track"></span>
        </label>
        <span class="cronometro" id="cronometro0100">--</span>
      </div>

      <div class="painel-esq">
        <span class="rotulo">Velocidade Máxima</span>
        <span class="valor-max" id="velocidadeMaxima">0</span>
        <span class="unidade">KM/H</span>
      </div>

      <div class="painel-esq">
        <span class="rotulo">Distância Percorrida</span>
        <span class="valor-max" id="distanciaPercorrida">0.00</span>
        <span class="unidade">KM</span>
      </div>

      <div class="painel-esq">
        <span class="rotulo">Tempo de Funcionamento</span>
        <span class="valor-max" id="tempoFuncionamento">00:00:00</span>
      </div>

    </div>

    <!-- Coluna central: velocímetro com anel tipo conta-giros -->
    <div class="col col-centro">
      <div class="gauge-wrap">
        <div class="gauge" id="gauge">
          <div class="gauge-inner">
            <div class="gauge-value" id="velocidade">0</div>
            <div class="gauge-unit">KM/H</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Coluna direita: latitude, longitude, altitude, precisão -->
    <div class="col col-direita">

      <div class="dado">
        <div class="rotulo">Latitude</div>
        <div class="valor" id="latitude">--</div>
      </div>

      <div class="dado">
        <div class="rotulo">Longitude</div>
        <div class="valor" id="longitude">--</div>
      </div>

      <div class="dado">
        <div class="rotulo">Altitude</div>
        <div class="valor" id="altitude">--</div>
      </div>

      <div class="dado">
        <div class="rotulo">Precisão</div>
        <div class="valor" id="precisao">--</div>
      </div>

    </div>

  </div>

  <!-- Ocultos por enquanto, mas continuam sendo atualizados internamente -->
  <div class="dado oculto">
    <div class="rotulo">Horário</div>
    <div class="valor" id="horario">--</div>
  </div>

  <div class="dado oculto">
    <div class="rotulo">Pontos coletados</div>
    <div class="valor" id="quantidade">0</div>
  </div>


  <div class="botoes">

    <button
        id="btnIniciar"
        onclick="iniciarGPS()">
        ▶ Iniciar
    </button>

    <button
        id="btnPausar"
        onclick="pausarGPS()"
        style="display: none;">
        ⏸ Pausar
    </button>

    <button
        id="btnRetomar"
        onclick="retomarGPS()"
        style="display: none;">
        ▶ Retomar
    </button>

    <button
        id="btnEncerrar"
        onclick="encerrarAtividade()"
        style="display: none;">
        ⏹ Encerrar
    </button>

    <button
        id="btnSalvar"
        onclick="salvarCSV()"
        disabled>
        💾 Salvar CSV
    </button>

  </div>

  <div class="rodape">Precisão e velocidade dependem do sinal de GPS do dispositivo</div>

  </div>


  <script>

    // VARIÁVEIS

    let gpsId = null;
    let pontosGPS = [];
    const VELOCIDADE_MAX = 180; // escala do mostrador, km/h

    const led = document.getElementById("led");
    const gauge = document.getElementById("gauge");
    const btnIniciar = document.getElementById("btnIniciar");
    const btnPausar = document.getElementById("btnPausar");
    const btnRetomar = document.getElementById("btnRetomar");
    const btnEncerrar = document.getElementById("btnEncerrar");
    const btnSalvar = document.getElementById("btnSalvar");

    // =====================================================
    // CONTROLE DE ESTADO DOS BOTÕES
    // =====================================================
    // Estados possíveis: "parado", "rodando", "pausado", "finalizado"

    function atualizarBotoes(estado) {
        const mostrar = (el, condicao) => {
            el.style.display = condicao ? "" : "none";
        };

        mostrar(btnIniciar, estado === "parado" || estado === "finalizado");
        mostrar(btnPausar, estado === "rodando");
        mostrar(btnRetomar, estado === "pausado");
        mostrar(btnEncerrar, estado === "pausado");

        btnSalvar.disabled = !(estado === "finalizado" && pontosGPS.length > 0);
    }
    const velocidadeMaximaEl = document.getElementById("velocidadeMaxima");
    const toggle0100 = document.getElementById("toggle0100");
    const cronometro0100El = document.getElementById("cronometro0100");

    let velocidadeMaxima = 0;
    let intervalId0100 = null;
    let inicio0100Ms = null;

    // Tempo de funcionamento
    const tempoFuncionamentoEl = document.getElementById("tempoFuncionamento");
    let tempoInicioMs = null;
    let tempoAcumuladoMs = 0;
    let tempoIntervalId = null;

    // Distância percorrida
    const distanciaPercorridaEl = document.getElementById("distanciaPercorrida");
    let distanciaTotalKm = 0;
    let ultimoPontoDistancia = null;

    // Rastro do trajeto (fundo da tela)
    const trilhaLinhaEl = document.getElementById("trilhaLinha");
    const trilhaPontoEl = document.getElementById("trilhaPonto");
    let trilhaPontos = [];

    function setGaugePct(kmh) {
        const pct = Math.max(0, Math.min(100, (kmh / VELOCIDADE_MAX) * 100));
        gauge.style.setProperty("--pct", pct.toFixed(1));
    }

    // =====================================================
    // DISTÂNCIA PERCORRIDA
    // =====================================================

    // Fórmula de Haversine: distância em km entre duas coordenadas
    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
        const R = 6371; // raio médio da Terra em km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;

        const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function atualizarDistancia(lat, lon) {

        if (ultimoPontoDistancia !== null) {
            const distancia = calcularDistanciaKm(
                ultimoPontoDistancia.lat,
                ultimoPontoDistancia.lon,
                lat,
                lon
            );

            distanciaTotalKm += distancia;
            distanciaPercorridaEl.textContent = distanciaTotalKm.toFixed(2);
        }

        ultimoPontoDistancia = { lat, lon };
    }

    function reiniciarDistancia() {
        distanciaTotalKm = 0;
        ultimoPontoDistancia = null;
        distanciaPercorridaEl.textContent = "0.00";
    }

    // =====================================================
    // TEMPO DE FUNCIONAMENTO
    // =====================================================

    function formatarTempo(segundosTotais) {
        const h = String(Math.floor(segundosTotais / 3600)).padStart(2, "0");
        const m = String(Math.floor((segundosTotais % 3600) / 60)).padStart(2, "0");
        const s = String(Math.floor(segundosTotais % 60)).padStart(2, "0");
        return `${h}:${m}:${s}`;
    }

    function formatarTempo(segundosTotais) {
        const h = String(Math.floor(segundosTotais / 3600)).padStart(2, "0");
        const m = String(Math.floor((segundosTotais % 3600) / 60)).padStart(2, "0");
        const s = String(Math.floor(segundosTotais % 60)).padStart(2, "0");
        return `${h}:${m}:${s}`;
    }

    function atualizarTempoDisplay() {
        const decorridoMs = tempoAcumuladoMs + (performance.now() - tempoInicioMs);
        tempoFuncionamentoEl.textContent = formatarTempo(decorridoMs / 1000);
    }

    function iniciarTempoFuncionamento() {
        tempoAcumuladoMs = 0;
        tempoFuncionamentoEl.textContent = "00:00:00";
        tempoInicioMs = performance.now();

        clearInterval(tempoIntervalId);
        tempoIntervalId = setInterval(atualizarTempoDisplay, 1000);
    }

    function pausarTempoFuncionamento() {
        if (tempoInicioMs !== null) {
            tempoAcumuladoMs += performance.now() - tempoInicioMs;
            tempoInicioMs = null;
        }
        clearInterval(tempoIntervalId);
        tempoIntervalId = null;
    }

    function retomarTempoFuncionamento() {
        tempoInicioMs = performance.now();
        clearInterval(tempoIntervalId);
        tempoIntervalId = setInterval(atualizarTempoDisplay, 1000);
    }

    // =====================================================
    // RASTRO DO TRAJETO (SVG de fundo)
    // =====================================================

    function reiniciarTrilha() {
        trilhaPontos = [];
        trilhaLinhaEl.setAttribute("points", "");
        trilhaPontoEl.setAttribute("cx", "-100");
        trilhaPontoEl.setAttribute("cy", "-100");
    }

    function atualizarTrilha(lat, lon) {

        trilhaPontos.push({ lat, lon });

        // Com um único ponto ainda não dá pra desenhar uma linha
        if (trilhaPontos.length < 2) {
            return;
        }

        const lats = trilhaPontos.map(p => p.lat);
        const lons = trilhaPontos.map(p => p.lon);

        const latMin = Math.min(...lats);
        const latMax = Math.max(...lats);
        const lonMin = Math.min(...lons);
        const lonMax = Math.max(...lons);

        // Corrige a distorção da longitude conforme a latitude
        const latMedioRad = ((latMin + latMax) / 2) * Math.PI / 180;
        const correcaoLon = Math.cos(latMedioRad) || 1;

        const largura = Math.max((lonMax - lonMin) * correcaoLon, 0.0001);
        const altura = Math.max(latMax - latMin, 0.0001);

        // Área útil dentro do viewBox 1000x1000, com margem
        const area = 760;
        const escala = area / Math.max(largura, altura);

        const offsetX = 120 + (area - largura * escala) / 2;
        const offsetY = 120 + (area - altura * escala) / 2;

        const pontosSvg = trilhaPontos.map(p => {
            const x = offsetX + (p.lon - lonMin) * correcaoLon * escala;
            const y = offsetY + (latMax - p.lat) * escala; // norte para cima
            return `${x.toFixed(1)},${y.toFixed(1)}`;
        });

        trilhaLinhaEl.setAttribute("points", pontosSvg.join(" "));

        const [ultimoX, ultimoY] = pontosSvg[pontosSvg.length - 1].split(",");
        trilhaPontoEl.setAttribute("cx", ultimoX);
        trilhaPontoEl.setAttribute("cy", ultimoY);
    }

    // =====================================================
    // CRONÔMETRO 0-100 KM/H
    // =====================================================

    function alternar0100(checkbox) {
        if (checkbox.checked) {
            iniciarContagem0100();
        } else {
            cancelarContagem0100();
        }
    }

    function iniciarContagem0100() {

        cronometro0100El.classList.remove("concluido");
        cronometro0100El.classList.add("ativo");

        clearInterval(intervalId0100);

        // Contagem regressiva 3, 2, 1...
        let restante = 3;
        cronometro0100El.textContent = restante + "s";

        intervalId0100 = setInterval(() => {
            restante--;

            if (restante > 0) {
                cronometro0100El.textContent = restante + "s";
                return;
            }

            // Acabou a contagem regressiva: começa a cronometrar
            clearInterval(intervalId0100);
            inicio0100Ms = performance.now();
            intervalId0100 = setInterval(atualizarCronometro0100, 100);

        }, 1000);
    }

    function atualizarCronometro0100() {
        const decorrido = (performance.now() - inicio0100Ms) / 1000;
        cronometro0100El.textContent = decorrido.toFixed(1) + "s";
    }

    function finalizarContagem0100() {
        clearInterval(intervalId0100);
        intervalId0100 = null;
        cronometro0100El.classList.remove("ativo");
        cronometro0100El.classList.add("concluido");
        toggle0100.checked = false;
    }

    function cancelarContagem0100() {
        // Para o cronômetro mas mantém o último valor exibido na tela
        clearInterval(intervalId0100);
        intervalId0100 = null;
        cronometro0100El.classList.remove("ativo");
    }

    // INICIAR GPS

    function iniciarGPS() {

        // Verifica se o navegador possui suporte ao GPS
        if (!navigator.geolocation) {
            alert("Seu navegador não suporta geolocalização.");
            return;
        }

        // Limpa os dados da atividade anterior
        pontosGPS = [];
        velocidadeMaxima = 0;
        velocidadeMaximaEl.textContent = "0";
        reiniciarTrilha();
        reiniciarDistancia();
        iniciarTempoFuncionamento();

        document.getElementById("quantidade").textContent = "0";
        document.getElementById("status").textContent = "Buscando localização...";
        led.classList.remove("erro");
        led.classList.add("on");

        // Inicia o acompanhamento da localização
        gpsId = navigator.geolocation.watchPosition(
            atualizarGPS,
            erroGPS,

            {
                // Solicita maior precisão possível
                enableHighAccuracy: true,

                // Não utilizar uma localização antiga
                maximumAge: 0,

                // Tempo máximo para obter uma posição
                timeout: 10000
            }
        );


        // Alterar estado dos botões

        atualizarBotoes("rodando");

        document.getElementById("status").textContent = "GPS ativo";
    }

    // RECEBER NOVA POSIÇÃO
    function atualizarGPS(position) {

        // Dados fornecidos pelo GPS
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const altitude = position.coords.altitude;
        const precisao = position.coords.accuracy;
        const velocidade = position.coords.speed;
        const timestamp = position.timestamp;

        // Criar objeto com os dados
        const ponto = {
            numero: pontosGPS.length + 1,
            timestamp: new Date(timestamp).toISOString(),
            latitude: latitude,
            longitude: longitude,
            altitude: altitude,
            precisao: precisao,
            velocidade: velocidade
        };

        // Adicionar ponto à lista
        pontosGPS.push(ponto);

        // Atualizar o rastro do trajeto no fundo da tela
        atualizarTrilha(latitude, longitude);

        // Atualizar a distância total percorrida
        atualizarDistancia(latitude, longitude);

        // Atualizar tela
        document.getElementById("latitude").textContent = latitude.toFixed(6);
        document.getElementById("longitude").textContent = longitude.toFixed(6);

        // Altitude
        if (altitude !== null) {
            document.getElementById("altitude").textContent = altitude.toFixed(2) + " m";
        } else {
            document.getElementById("altitude").textContent = "Não disponível";
        }

        // Precisão
        document.getElementById("precisao").textContent = precisao.toFixed(2) + " m";

        // Velocidade (mostrador central)
        if (velocidade !== null) {
            const velocidadeKmh = velocidade * 3.6;

            document.getElementById("velocidade").textContent = velocidadeKmh.toFixed(0);
            setGaugePct(velocidadeKmh);

            // Velocidade máxima do percurso
            if (velocidadeKmh > velocidadeMaxima) {
                velocidadeMaxima = velocidadeKmh;
                velocidadeMaximaEl.textContent = velocidadeMaxima.toFixed(0);
            }

            // Cronômetro 0-100: para automaticamente ao atingir 100 km/h
            if (intervalId0100 !== null && velocidadeKmh >= 100) {
                finalizarContagem0100();
            }

        } else {

            document.getElementById("velocidade").textContent = "--";
            setGaugePct(0);
        }

        // Horário
        const horario = new Date(timestamp);

        document.getElementById("horario").textContent = horario.toLocaleTimeString("pt-BR");

        // Quantidade de pontos
        document.getElementById("quantidade").textContent = pontosGPS.length;

        // Console para acompanhar os dados
        console.log(ponto);
    }

    // ERRO GPS
    function erroGPS(error) {

        console.log("Erro GPS:", error);
        let mensagem = "";

        switch (error.code) {
            case error.PERMISSION_DENIED:
                mensagem = "Permissão de localização negada.";
                break;

            case error.POSITION_UNAVAILABLE:
                mensagem = "Localização indisponível.";
                break;

            case error.TIMEOUT:
                mensagem = "Tempo limite para obter localização.";
                break;

            default:
                mensagem = "Erro desconhecido ao obter localização.";
        }

        document.getElementById("status").textContent = "Erro";
        led.classList.remove("on", "pausado");
        led.classList.add("erro");

        if (gpsId !== null) {
            navigator.geolocation.clearWatch(gpsId);
            gpsId = null;
        }

        cancelarContagem0100();
        pausarTempoFuncionamento();
        atualizarBotoes("pausado");

        alert(mensagem);
    }


    // =====================================================
    // PAUSAR / RETOMAR / ENCERRAR
    // =====================================================

    function pausarGPS() {

        if (gpsId !== null) {
            navigator.geolocation.clearWatch(gpsId);
            gpsId = null;
        }

        document.getElementById("status").textContent = "Pausado";
        led.classList.remove("on", "erro");
        led.classList.add("pausado");

        cancelarContagem0100();
        pausarTempoFuncionamento();

        atualizarBotoes("pausado");
    }

    function retomarGPS() {

        if (!navigator.geolocation) {
            alert("Seu navegador não suporta geolocalização.");
            return;
        }

        document.getElementById("status").textContent = "GPS ativo";
        led.classList.remove("pausado", "erro");
        led.classList.add("on");

        gpsId = navigator.geolocation.watchPosition(
            atualizarGPS,
            erroGPS,
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            }
        );

        retomarTempoFuncionamento();

        atualizarBotoes("rodando");
    }

    function encerrarAtividade() {

        if (gpsId !== null) {
            navigator.geolocation.clearWatch(gpsId);
            gpsId = null;
        }

        document.getElementById("status").textContent = "Atividade finalizada";
        led.classList.remove("on", "erro", "pausado");
        cancelarContagem0100();
        pausarTempoFuncionamento();

        atualizarBotoes("finalizado");
    }


    // =====================================================
    // SALVAR CSV
    // =====================================================

    async function salvarCSV() {

        if (pontosGPS.length === 0) {
            alert("Nenhum dado GPS foi registrado.");
            return;
        }

        // ---------------------------------------------
        // Cabeçalho do CSV
        // ---------------------------------------------

        let csv = "ponto,timestamp,latitude,longitude,altitude,precisao,velocidade\n";

        // ---------------------------------------------
        // Adicionar cada ponto
        // ---------------------------------------------

        pontosGPS.forEach(ponto => {

            const altitude = ponto.altitude !== null ? ponto.altitude : "";
            const velocidade = ponto.velocidade !== null ? ponto.velocidade : "";

            csv +=
                `${ponto.numero},` +
                `${ponto.timestamp},` +
                `${ponto.latitude},` +
                `${ponto.longitude},` +
                `${altitude},` +
                `${ponto.precisao},` +
                `${velocidade}\n`;
        });

        // ---------------------------------------------
        // Nome do arquivo
        // ---------------------------------------------

        const agora = new Date();

        const nomeArquivo =
            "atividade_" +
            agora.getFullYear() +
            "-" +
            String(agora.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(agora.getDate()).padStart(2, "0") +
            "_" +
            String(agora.getHours()).padStart(2, "0") +
            "-" +
            String(agora.getMinutes()).padStart(2, "0") +
            ".csv";

        // ---------------------------------------------
        // Salvar arquivo (via capacidade de download do viewer)
        // ---------------------------------------------

        try {
            const downloads = (window.claude && typeof window.claude.use === "function")
                ? await window.claude.use("downloads")
                : null;

            if (downloads) {
                await downloads.save({ filename: nomeArquivo, data: csv });
                alert("Atividade salva com sucesso!");
            } else {
                alert("O download de arquivos não está disponível nesta visualização.");
            }
        } catch (e) {
            console.error(e);
            alert("Não foi possível salvar o arquivo.");
        }
    }

  </script>
